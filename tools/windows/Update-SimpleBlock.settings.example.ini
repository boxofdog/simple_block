# Simple Block updater settings.
# Copy this file to Update-SimpleBlock.settings.ini (same folder) and edit it with Notepad.
# Lines starting with # are comments. Paths need no quotes or doubled backslashes, and
# environment variables such as %APPDATA% or %USERPROFILE% are expanded.

# Game Directory of your Simple Block installation (the folder that contains "mods").
# Must match Minecraft Launcher > Installations > (your Fabric installation) > Edit > Game Directory.
GameDir = %APPDATA%\Minecraft-Instances\SimpleBlock

# After a successful run: ask, always or never open the Minecraft Launcher.
OpenLauncher = ask

# Only needed if the launcher is not found automatically, for example:
# LauncherPath = C:\Program Files (x86)\Minecraft Launcher\MinecraftLauncher.exe

# Only needed if gh.exe is not on PATH:
# GhPath = C:\Program Files\GitHub CLI\gh.exe

# Where builds come from. Leave these alone unless the repository moves.
# Repository = boxofdog/simple_block
# Branch = main
# Workflow = build.yml
# ArtifactName = simple-block-mod
